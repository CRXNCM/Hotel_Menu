# Render Blueprint: https://render.com/docs/infrastructure-as-code
# After connecting the repo, use "Apply" or create the Web Service manually with the same settings.

services:
  - type: web
    name: hotel-menu-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGIN
        sync: false
